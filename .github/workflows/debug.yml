name: Guevarah VPN Debug Build

on:
  push:
    branches: [ dev ]          # ← Changed from 'master' to 'dev'
  pull_request:
    branches: [ dev ]          # ← Changed from 'master' to 'dev'
  workflow_dispatch:           # Allows manual trigger from any branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform and build-tools
        run: |
          COMPILE_SDK=34
          BUILD_TOOLS_VER=34.0.0
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}"
          mkdir -p "$ANDROID_SDK_ROOT"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --install "platform-tools" "platforms;android-${COMPILE_SDK}" "build-tools;${BUILD_TOOLS_VER}"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses || true
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Set up Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q -o android-ndk-r25c-linux.zip -d android-ndk-r25c
          echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/android-ndk-r25c" >> $GITHUB_ENV
          echo "$GITHUB_WORKSPACE/android-ndk-r25c" >> $GITHUB_PATH

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Ensure app/libs exists
        run: |
          mkdir -p app/libs
          touch app/libs/.gitkeep

      - name: Generate debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug, O=Android, C=US"

      - name: Build APK variants (safe)
        run: |
          set -euo pipefail
          TASK_OUTPUT=$(./gradlew :app:tasks --all --console=plain 2>/dev/null || true)
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📋 Available assemble tasks"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "$TASK_OUTPUT" | grep -i assemble | grep -v "tasks" || echo "No assemble tasks found"
          echo ""
          
          run_if_exists() {
            local t=$1
            if echo "$TASK_OUTPUT" | grep -q "$t"; then
              echo "✅ Running Gradle task: $t"
              ./gradlew ":app:$t" --no-daemon --stacktrace --info
              return 0
            else
              echo "⏭️ Task not found: $t"
              return 1
            fi
          }
          
          # Try flavor-specific tasks first
          run_if_exists assembleOssDebug || true
          run_if_exists assembleGmsDebug || true
          
          # Fallback to plain assembleDebug
          if echo "$TASK_OUTPUT" | grep -q "assembleDebug"; then
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "✅ Running fallback: assembleDebug"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            ./gradlew :app:assembleDebug --no-daemon --stacktrace --info
          else
            echo "❌ No assemble tasks found!"
            exit 1
          fi

      - name: Find and list all APK files
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔍 SEARCHING FOR APK FILES"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          find . -name "*.apk" -type f 2>/dev/null
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📁 DETAILED APK PATHS"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          find . -path "*/build/outputs/apk/*" -name "*.apk" -type f 2>/dev/null | while read f; do
            echo "APK: $f"
            ls -lh "$f"
          done

      - name: Upload all found APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Guevarah-VPN
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/*/debug/*.apk
            app/build/outputs/apk/**/debug/*.apk
            **/build/outputs/apk/*/debug/*.apk